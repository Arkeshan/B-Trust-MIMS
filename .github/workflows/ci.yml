name: B-Trust MIMS CI/CD Pipeline

on:
  push:
    branches: [ main, fix_bugs ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Go Backend Build & Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Verify Go module dependencies
        run: go mod verify

      - name: Compile Go microservice binary
        run: go build -v ./...

  frontend-ci:
    name: Next.js Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Next.js production build
        run: npm run build
